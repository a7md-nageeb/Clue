<svg width="1080" height="760" viewBox="0 0 1080 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="540" y1="0" x2="540" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CB0F5"/>
      <stop offset="0.45" stop-color="#669DF2"/>
      <stop offset="1" stop-color="#4170B8"/>
    </linearGradient>
    <linearGradient id="glow" x1="540" y1="80" x2="540" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2343" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1080" height="760" fill="url(#sky)"/>
  <ellipse cx="540" cy="120" rx="420" ry="180" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="540" y="118" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Nunito', sans-serif" font-size="54" font-weight="700" letter-spacing="-1.2">Clue</text>
  <text x="540" y="162" text-anchor="middle" fill="#F0F6FF" fill-opacity="0.92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Nunito', sans-serif" font-size="24" font-weight="500">Fast access to the things you forget</text>

  <!-- Drag hint -->
  <g filter="url(#softShadow)">
    <rect x="300" y="500" width="480" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <text x="540" y="536" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Nunito', sans-serif" font-size="22" font-weight="600">Drag Clue to Applications</text>
  </g>

  <!-- Arrow between icon drop zones -->
  <path d="M360 360H720" stroke="#F5F5F7" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12"/>
  <path d="M700 342L728 360L700 378" stroke="#F5F5F7" stroke-opacity="0.7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
